name: dbg-webkit
on:
  push:
    branches: [dbg-webkit]
permissions:
  contents: read
jobs:
  dbg:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BROWSER: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: feedback x2
        run: for i in 1 2; do echo "##### feedback $i"; node tests/e2e/feedback.mjs || true; done
      - name: pages, add-flow, mobile-back
        run: for t in pages add-flow mobile-back selection; do echo "##### $t"; node tests/e2e/$t.mjs || true; done
